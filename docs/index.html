<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Bird ID</title>
  <style>
    :root {
      --bg: #f5f5f2;
      --fg: #1d1d1b;
      --accent: #2f6f4f;
      --muted: #6b6b66;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #161816;
        --fg: #f0f0ec;
        --accent: #5fb88a;
        --muted: #9a9a94;
      }
    }
    :root[data-theme="dark"] {
      --bg: #161816;
      --fg: #f0f0ec;
      --accent: #5fb88a;
      --muted: #9a9a94;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, system-ui, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      gap: 12px;
    }
    h1 {
      font-size: 1.3rem;
      margin: 0;
    }
    #camera {
      width: 100%;
      flex: 1;
      min-height: 0;
      object-fit: cover;
      border-radius: 12px;
      background: #000;
    }
    #status {
      min-height: 4.5em;
      font-size: 1.1rem;
      white-space: pre-line;
      text-align: center;
      color: var(--fg);
    }
    #identify {
      font-size: 1.2rem;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      width: 100%;
    }
    #identify:disabled {
      opacity: 0.6;
    }
    p.note {
      margin: 0;
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Bird ID</h1>
  <video id="camera" playsinline muted autoplay></video>
  <div id="status">Point the camera at a bird</div>
  <button id="identify" disabled>Identify bird</button>
  <p class="note">Needs camera access and an internet connection to load the model.</p>
  <script src="app.js"></script>
</body>
</html>
